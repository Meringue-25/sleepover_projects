<!DOCTYPE html>
<html>
    <head>
        <title>Yuki's Tic Tac Toe</title>
        <link rel="stylesheet" href="tictactoe.css">
    </head>

    <body>
        <h1>Yuki's Tic Tac Toe 𐙚 ‧₊˚ ⋅</h1>
        <hr>
        <br>
        <div id="board">
                <div data-cell-index="0" class="board-cube"></div>
                <div data-cell-index="1" class="board-cube"></div>
                <div data-cell-index="2" class="board-cube"></div>
                <div data-cell-index="3" class="board-cube"></div>
                <div data-cell-index="4" class="board-cube"></div>
                <div data-cell-index="5" class="board-cube"></div>
                <div data-cell-index="6" class="board-cube"></div>
                <div data-cell-index="7" class="board-cube"></div>
                <div data-cell-index="8" class="board-cube"></div>
        </div>
        <button id="restart-button">Restart</button>
        <script src="tictactoe.js"></script>
    </body>
</html>
